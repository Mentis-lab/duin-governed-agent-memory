<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-iKzbTLTimia8176bH2+QGxj+QrCGRIOxADZx9n1DSXs='; style-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; img-src 'self' data: blob:"
    />
    <title>DUIN</title>
    <!-- Pre-paint theme stamp — sets data-theme-mode from the mirrored setting
         (default light) before React loads, so the correct palette paints on the
         first frame instead of flashing the dark base :root. Hash pinned in CSP
         above; keep the script text byte-identical if edited. -->
    <script>try{document.documentElement.dataset.themeMode=localStorage.getItem("duin.themeMode")||"light"}catch(e){document.documentElement.dataset.themeMode="light"}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
